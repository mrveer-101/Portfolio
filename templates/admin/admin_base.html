<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NIRVAN | Executive Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'obsidian': '#0F172A',
                        'accent-blue': '#1E40AF',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-obsidian text-slate-900 dark:text-white font-sans antialiased overflow-hidden flex h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white dark:bg-[#0a0f1c] border-r border-slate-200 dark:border-white/5 flex flex-col hidden md:flex">
        <!-- Brand -->
        <div class="h-20 flex items-center px-8 border-b border-slate-200 dark:border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-blue to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <span class="font-display font-black text-xl tracking-tight">NIRVAN OS</span>
            </div>
        </div>

        <!-- Nav Links -->
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <p class="px-4 text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Content</p>
            
            <a href="{% url 'core:dashboard' %}" class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'dashboard' %}bg-accent-blue/10 text-accent-blue dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5{% endif %} rounded-xl font-bold transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            
            <a href="{% url 'core:manage_blogs' %}" class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'manage_blogs' %}bg-accent-blue/10 text-accent-blue dark:text-blue-400 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 font-medium{% endif %} rounded-xl transition-colors">
                <i data-lucide="file-text" class="w-5 h-5"></i> Manage Blogs
            </a>
            
            <a href="{% url 'core:manage_projects' %}" class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'manage_projects' %}bg-accent-blue/10 text-accent-blue dark:text-blue-400 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 font-medium{% endif %} rounded-xl transition-colors">
                <i data-lucide="folder-git-2" class="w-5 h-5"></i> Manage Projects
            </a>

            <p class="px-4 text-xs font-bold text-slate-400 uppercase tracking-wider mt-8 mb-4">Settings</p>

            <a href="{% url 'core:manage_profile' %}" class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'manage_profile' %}bg-accent-blue/10 text-accent-blue dark:text-blue-400 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 font-medium{% endif %} rounded-xl transition-colors">
                <i data-lucide="user" class="w-5 h-5"></i> Profile
            </a>
        </nav>

        <!-- Theme & Logout -->
        <div class="p-4 border-t border-slate-200 dark:border-white/5 space-y-2">
            <!-- Theme Toggle -->
            <button onclick="toggleAdminTheme()" class="w-full flex items-center justify-between px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 rounded-xl font-bold transition-colors">
                <span class="flex items-center gap-3">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                    <span class="dark:hidden">Light Mode</span>
                    <span class="hidden dark:block">Dark Mode</span>
                </span>
                <div class="w-8 h-4 bg-slate-300 dark:bg-slate-600 rounded-full relative transition-colors">
                    <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 left-0.5 dark:translate-x-4 transition-transform"></div>
                </div>
            </button>

            <!-- Logout -->
            <a href="{% url 'core:custom_logout' %}" class="flex items-center gap-3 px-4 py-3 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-xl font-bold transition-colors">
                <i data-lucide="log-out" class="w-5 h-5"></i> Logout
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-20 bg-white/80 dark:bg-[#0a0f1c]/80 backdrop-blur-md border-b border-slate-200 dark:border-white/5 flex items-center justify-between px-8 z-10">
            <div class="flex items-center gap-4">
                <!-- Mobile Menu Button (hidden on desktop) -->
                <button class="md:hidden text-slate-500 hover:text-slate-900 dark:hover:text-white">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <h1 class="text-xl font-bold font-display">{% block header_title %}Dashboard{% endblock %}</h1>
            </div>

            <div class="flex items-center gap-4">
                <a href="{% url 'core:index' %}" target="_blank" class="hidden sm:flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5">
                    <i data-lucide="external-link" class="w-4 h-4"></i> View Live Site
                </a>
                <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center font-bold font-display text-accent-blue border border-slate-300 dark:border-white/10">
                    A
                </div>
            </div>
        </header>

        <!-- DASHBOARD CONTENT (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-8 relative">
            <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.02]" style="background-image:radial-gradient(circle at 2px 2px,black 1px,transparent 0);background-size:24px 24px; pointer-events:none;"></div>
            
            <div class="max-w-6xl mx-auto relative z-10">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Theme Management
        function toggleAdminTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('admin-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('admin-theme', 'dark');
            }
        }
        
        // Initialize theme based on localStorage
        if (localStorage.getItem('admin-theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else if (localStorage.getItem('admin-theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
