{% extends "admin/admin_base.html" %}

{% block title %}Portfolio | Edit Project{% endblock %}
{% block header_title %}Edit Project{% endblock %}

{% block content %}
<div class="mb-8 flex items-center justify-between">
    <div>
        <h2 class="text-2xl font-display font-black tracking-tight mb-1">Edit Project</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Editing: {{ slug }}</p>
    </div>
    <a href="{% url 'core:manage_projects' %}" class="px-4 py-2 bg-slate-200 dark:bg-white/10 text-slate-700 dark:text-slate-300 font-bold rounded-lg hover:bg-slate-300 dark:hover:bg-white/20 transition-colors text-sm">
        Cancel
    </a>
</div>

<div class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 rounded-2xl p-8 shadow-sm">
    <form class="space-y-6">
        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Project Name</label>
            <input type="text" value="Anulekh Project" class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Category Tag</label>
                <input type="text" value="Python / Web App" class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Status</label>
                <select class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors">
                    <option value="active" selected>● Active</option>
                    <option value="progress">In Progress</option>
                    <option value="shipped">Shipped</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Short Description</label>
            <input type="text" value="An intelligent note-taking and document creation application currently under active development." class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">GitHub URL</label>
            <input type="url" value="https://github.com/mrveer-101/Portfolio" class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Markdown Content</label>
            <textarea rows="8" class="w-full bg-slate-50 dark:bg-[#0a0f1c] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue transition-colors font-mono text-sm"># Anulekh Project</textarea>
        </div>

        <div class="pt-4 border-t border-slate-200 dark:border-white/5 flex justify-end gap-3">
            <button type="button" class="px-6 py-2.5 bg-accent-blue text-white font-bold rounded-xl shadow-lg shadow-accent-blue/20 hover:scale-105 transition-transform">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
