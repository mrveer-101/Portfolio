<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NIRVAN | Portfolio{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (via CDN for rapid development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js (Logic & Micro-animations) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX (AJAX Interactivity) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script>
        // Tailwind Configuration for Premium Aesthetic
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'obsidian': '#080C14',
                        'accent-orange': '#FFA500',
                        'accent-purple': '#8B5CF6',
                        'accent-purple-light': '#A78BFA',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <script>
        // Theme Management (Prevent Flash of Unstyled Content)
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body class="antialiased font-sans selection:bg-accent-purple selection:text-white bg-white dark:bg-obsidian text-slate-900 dark:text-slate-200 transition-colors duration-300" 
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      x-data="{ 
        darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),
        toggleTheme() {
            this.darkMode = !this.darkMode;
            if (this.darkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }
      }">
    
    {% include "partials/_navbar.html" %}

    <!-- Main Content Area -->
    <main class="pt-20">
        {% block content %}
        {% endblock %}
    </main>

    {% include "partials/_footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
