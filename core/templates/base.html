<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NIRVAN | Portfolio{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (via CDN for rapid development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js (Logic & Micro-animations) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX (AJAX Interactivity) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script>
        // Tailwind Configuration for Premium Aesthetic
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'obsidian': '#080C14',
                        'accent-orange': '#FFA500',
                        'accent-purple': '#8B5CF6',
                        'accent-purple-light': '#A78BFA',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        body {
            background-color: #0A0A0A;
            color: #E5E5E5;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="antialiased font-sans selection:bg-accent-violet selection:text-white" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    {% include "partials/_navbar.html" %}

    <!-- Main Content Area -->
    <main class="pt-20">
        {% block content %}
        {% endblock %}
    </main>

    {% include "partials/_footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
