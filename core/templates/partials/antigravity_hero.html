<!-- Antigravity Particle Background Partial -->
<div id="antigravity-container" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[100vw] h-[600px] -z-10 overflow-hidden pointer-events-none">
    <canvas id="antigravity-canvas" class="w-full h-full"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
    (function() {
        const container = document.getElementById('antigravity-container');
        const canvas = document.getElementById('antigravity-canvas');
        if (!container || !canvas) return;

        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = 0.05; // Very low gravity

        const render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: container.offsetWidth,
                height: container.offsetHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Invisible Boundaries (wider than viewport to allow particles to move off-screen slightly)
        const ground = Bodies.rectangle(container.offsetWidth / 2, container.offsetHeight + 50, container.offsetWidth * 2, 100, { isStatic: true });
        Composite.add(world, ground);

        // Particles
        const colors = ['#3b82f6', '#8b5cf6', '#6366f1', '#f472b6', '#22d3ee'];
        
        function spawnParticle() {
            const x = Math.random() * container.offsetWidth;
            const y = -20;
            const radius = 1 + Math.random() * 3;
            const color = colors[Math.floor(Math.random() * colors.length)];

            const particle = Bodies.circle(x, y, radius, {
                restitution: 0.8,
                friction: 0.01,
                render: {
                    fillStyle: color,
                    shadowBlur: 10,
                    shadowColor: color
                }
            });

            // Set random initial velocity
            Matter.Body.setVelocity(particle, {
                x: (Math.random() - 0.5) * 2,
                y: Math.random() * 2
            });

            Composite.add(world, particle);
            
            // Cleanup old particles
            if (Composite.allBodies(world).length > 60) {
                const oldest = Composite.allBodies(world).find(b => !b.isStatic);
                if (oldest) Composite.remove(world, oldest);
            }
        }

        // Mouse interaction
        let mousePos = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
        });

        Events.on(engine, 'beforeUpdate', () => {
            const bodies = Composite.allBodies(world);
            bodies.forEach(body => {
                if (body.isStatic) return;

                const dx = body.position.x - mousePos.x;
                const dy = body.position.y - mousePos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 200) {
                    const force = (200 - distance) * 0.00002;
                    Matter.Body.applyForce(body, body.position, {
                        x: dx * force,
                        y: dy * force
                    });
                }
                
                // Anti-gravity float
                Matter.Body.applyForce(body, body.position, { x: 0, y: -0.00005 });
            });
        });

        // Spawn loop
        setInterval(spawnParticle, 800);
        for(let i=0; i<30; i++) spawnParticle();

        // Resize
        window.addEventListener('resize', () => {
            const w = container.offsetWidth;
            const h = container.offsetHeight;
            render.canvas.width = w;
            render.canvas.height = h;
            render.options.width = w;
            render.options.height = h;
            Matter.Body.setPosition(ground, { x: w / 2, y: h + 50 });
        });
    })();
</script>
