<!-- Footer Section -->
<footer class="mt-20 border-t border-gray-800 pt-20 pb-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Subscribe Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-10 mb-20 relative">
            
            <!-- Left Side: Headline -->
            <div class="w-full md:w-1/2 space-y-4">
                <p class="text-accent-purple font-semibold text-sm tracking-widest uppercase">Subscribe</p>
                <h2 class="text-3xl md:text-4xl font-bold text-white leading-tight">
                    Subscribe To Get Latest<br>Update From Us
                </h2>
                
                <!-- Decorative Swirly Arrow (Simplified SVG) -->
                <div class="absolute -bottom-10 right-1/2 translate-x-1/2 hidden md:block opacity-20">
                    <svg width="120" height="60" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 55C20 55 40 10 70 10C100 10 115 45 115 45" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
                        <path d="M115 45L108 38M115 45L108 52" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="w-full md:w-5/12 space-y-6">
                <p class="text-gray-400 text-sm leading-relaxed">
                    Lorem ipsum dolor sit amet consectetur. Tincidunt egestas sed integer est libero urna. Ac habitasse dolor.
                </p>
                <form class="flex w-full" hx-post="/subscribe/" hx-swap="outerHTML">
                    {% csrf_token %}
                    <input type="email" name="email" placeholder="Enter your email" 
                           class="flex-grow bg-white/5 border border-gray-700 text-white px-6 py-4 rounded-l-xl focus:outline-none focus:border-accent-purple transition-colors">
                    <button type="submit" class="bg-accent-purple hover:bg-accent-purple-light text-white px-8 py-4 rounded-r-xl font-bold transition-all">
                        Subscribe
                    </button>
                </form>
            </div>
        </div>

        <!-- Brand & Links Section -->
        <div class="flex flex-col md:flex-row justify-between items-center py-10 border-t border-gray-800/50 gap-6">
            <div class="flex items-center space-x-2">
                <div class="w-6 h-6 bg-accent-purple rounded-full flex items-center justify-center scale-75">
                    <div class="w-1 h-1 bg-white rounded-full mx-0.5"></div>
                    <div class="w-1 h-1 bg-white rounded-full mx-0.5"></div>
                </div>
                <span class="text-2xl font-bold text-white tracking-tight">OPPA</span>
            </div>
            
            <nav class="flex flex-wrap justify-center gap-8 text-gray-400 font-medium">
                <a href="#home" class="hover:text-white transition-colors">Home</a>
                <a href="#about" class="hover:text-white transition-colors">About</a>
                <a href="#services" class="hover:text-white transition-colors">Services</a>
                <a href="#portfolio" class="hover:text-white transition-colors">Portfolio</a>
                <a href="#contact" class="hover:text-white transition-colors">Contact</a>
            </nav>
        </div>

        <!-- Copyright -->
        <div class="text-center pt-8 border-t border-gray-800/30">
            <p class="text-gray-600 text-sm">
                &copy; Copyright 2016 – {% now "Y" %} | All Rights Reserved | Built with NIRVAN
            </p>
        </div>
    </div>
</footer>
